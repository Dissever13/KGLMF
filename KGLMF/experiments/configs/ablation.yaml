ablations:
  - name: "no_graph_structure"
    description: "Flat latent memory pool without graph edges — all nodes in one pool, retrieval by cosine similarity only"
    modify: "disable_graph_edges"

  - name: "no_role_aware"
    description: "Uniform memory composition without role conditioning — all agents get same memory"
    modify: "remove_role_projection"

  - name: "no_adaptive_budget"
    description: "Fixed retrieval budget K=16 regardless of task complexity"
    modify: "fix_budget_k16"

  - name: "no_compression"
    description: "Inject all retrieved memories without compression — raw concatenation"
    modify: "disable_compression"

  - name: "no_evolution"
    description: "Static graph — no merge, prune, or expand operations after initialization"
    modify: "disable_evolution"

  - name: "no_latent_injection"
    description: "Text-based memory — retrieve text nodes and concatenate to prompt instead of latent injection"
    modify: "use_text_memory"

  - name: "full_kg_lmf"
    description: "Complete KG-LMF with all components enabled"
    modify: "none"
